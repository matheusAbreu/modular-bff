# Config application
modular-bff.api.web.active=${BFF_API_WEB_ACTIVE:true}
modular-bff.api.app.active=${BFF_API_APP_ACTIVE:false}


# Health Check
quarkus.smallrye-health.root-path=/health
quarkus.smallrye-health.ui.root-path=/health-ui

# Swagger
quarkus.smallrye-openapi.path=/openapi
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/docs


# API Config
quarkus.http.port=${API_PORT:8081}
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.exposed-headers=Content-Disposition,Content-Type,Cache-Control


# db config
quarkus.datasource."bff".active=true
quarkus.datasource."bff".db-kind=postgresql
quarkus.datasource."bff".jdbc.driver=org.postgresql.Driver
quarkus.datasource."bff".jdbc.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/postgres}
quarkus.datasource."bff".username=${POSTGRES_USER:postgres}
quarkus.datasource."bff".password=${POSTGRES_PASSWORD:postgres}
quarkus.datasource."bff".health-exclude=false
quarkus.hibernate-orm."bff".datasource=bff
quarkus.hibernate-orm."bff".packages=org.acme
quarkus.hibernate-orm."bff".database.generation=none
quarkus.hibernate-orm."bff".log.sql=false




