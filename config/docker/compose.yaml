name: modular-bff

services:
  postgres-db:
    image: postgres:18-alpine3.23
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
networks:
  backend:        # nome interno (usado para referenciar nos serviços)
    name: modular-bff_default   # nome real criado no Docker
    driver: bridge