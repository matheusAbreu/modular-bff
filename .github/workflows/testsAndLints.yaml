name: Test Lint

on:
  pull_request:
    branches: "*"
  push:
    branches: [main]

jobs:

  lint: 
    name: Run Linters
    runs-on: 21-alpine-jdk
    permissions:
      contents: write
      pull-requests: write
      repository-projects: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'adopt'
          cache: 'gradle'

      - name: Run Ktlint
        run: make lint

      - name: Run Detekt
        run: make detekt

  test:
    name: Run Tests and Linters
    runs-on: 21-alpine-jdk
    permissions:
      contents: write
      pull-requests: write
      repository-projects: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'adopt'
          cache: 'gradle'
      - name: Up dependencies for running tests
        run: make test

